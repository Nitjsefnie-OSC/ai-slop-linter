# OSC fork CI wrapper - generated by scripts/make_wrapper.py;
# check with scripts/verify_wrapper.py before pushing.
# Jobs kept (verbatim, except the two sanctioned adaptations:
# checkout pinned to ${{ inputs.target_ref }}, and the inserted
# Provenance step):
#   - test
#   - package
#   - release-gate
#   - bench
#   - action
#   - textlint
#   - vscode
#   - coverage
#   - ci-ok [no checkout step - no Provenance step added, none invented] [keeps its own if: (always()) - evaluated as written on workflow_dispatch too]
# DELIBERATELY EXCLUDED (loud):
#   - none

name: OSC manual CI

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Git branch, tag, or 40-character commit SHA to validate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: osc-manual-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        node:
        - 20
        - 22
        - 24
        include:
        - os: windows-latest
          node: 24
        - os: macos-latest
          node: 24
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        persist-credentials: false
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: ${{ matrix.node }}
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npm run lint
    - run: npm test
    - name: Lint this repository's own Markdown with the built linter (.slop.json,
        maxScore 3)
      run: node dist/src/cli.js
      if: runner.os != 'Windows'
  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        persist-credentials: false
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npm run build
    - run: npx publint --strict
    - run: npx attw --pack . --ignore-rules cjs-resolves-to-esm
    - name: Install the packed tarball in an empty project and run it
      run: sh scripts/smoke-tarball.sh
  release-gate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        persist-credentials: false
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npm run build --if-present
    - run: node scripts/release-gate.mjs
  bench:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        persist-credentials: false
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npm run build
    - run: node bench/precision.mjs --check
    - run: node bench/typography.mjs --check
    - run: node bench/dash.mjs --check
    - run: node bench/packs.mjs --check
    - run: node bench/compare-words.mjs --check
    - run: node bench/compare-qualifiers.mjs --check
    - run: node scripts/readme-demo.mjs --check
  action:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        persist-credentials: false
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npm run build
    - name: Pack this commit, and count the sloppy fixture's findings with the CLI
      id: prep
      run: |
        echo "tarball=$PWD/$(npm pack --ignore-scripts --silent | tail -n 1)" >> "$GITHUB_OUTPUT"
        count=$(node dist/src/cli.js --format json --warn test/fixtures/sloppy.md | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).reduce((n,r)=>n+r.findings.length,0)))')
        echo "expected=$count" >> "$GITHUB_OUTPUT"
        mkdir -p "space dir"
        cp test/fixtures/sloppy.md "space dir/sloppy copy.md"
    - name: Sloppy fixture, warn-only
      id: sloppy
      uses: ./
      with:
        files: test/fixtures/sloppy.md
        warn-only: 'true'
        comment: 'false'
        pr-body: 'false'
        package: ${{ steps.prep.outputs.tarball }}
    - name: Sloppy fixture, failing
      id: strict
      continue-on-error: true
      uses: ./
      with:
        files: test/fixtures/sloppy.md
        warn-only: 'false'
        comment: 'false'
        pr-body: 'false'
        package: ${{ steps.prep.outputs.tarball }}
    - name: Clean fixture
      id: clean
      continue-on-error: true
      uses: ./
      with:
        files: test/fixtures/clean.md
        warn-only: 'false'
        comment: 'false'
        pr-body: 'false'
        package: ${{ steps.prep.outputs.tarball }}
    - name: A path with a space, one per line
      id: spaced
      continue-on-error: true
      uses: ./
      with:
        files: |
          space dir/sloppy copy.md
        warn-only: 'true'
        comment: 'false'
        pr-body: 'false'
        package: ${{ steps.prep.outputs.tarball }}
    - name: A path with a space on one line is rejected
      id: spaced-one-line
      continue-on-error: true
      uses: ./
      with:
        files: space dir/sloppy copy.md
        warn-only: 'true'
        comment: 'false'
        pr-body: 'false'
        package: ${{ steps.prep.outputs.tarball }}
    - name: The outputs and outcomes are the ones the Action promises
      run: |
        fail=0
        check() { if [ "$2" = "$3" ]; then echo "ok: $1"; else echo "::error::$1: expected '$3', got '$2'"; fail=1; fi; }
        [ "$EXPECTED" -gt 0 ] || { echo "::error::the CLI counted no findings on the sloppy fixture, so the comparison below proves nothing"; fail=1; }
        check "warn-only run passes" "$SLOPPY_OUTCOME" success
        check "findings output equals the CLI's --format json count" "$SLOPPY" "$EXPECTED"
        check "warn-only false fails on the sloppy fixture" "$STRICT_OUTCOME" failure
        check "the failing run still reports the same count" "$STRICT" "$EXPECTED"
        check "clean fixture passes" "$CLEAN_OUTCOME" success
        check "clean fixture has 0 findings" "$CLEAN" 0
        check "a path with a space, one per line, is linted" "$SPACED_OUTCOME" success
        check "and counted" "$SPACED" "$EXPECTED"
        check "a path with a space on one line is rejected" "$SPACED_ONE_LINE_OUTCOME" failure
        exit "$fail"
      env:
        EXPECTED: ${{ steps.prep.outputs.expected }}
        SLOPPY: ${{ steps.sloppy.outputs.findings }}
        SLOPPY_OUTCOME: ${{ steps.sloppy.outcome }}
        STRICT: ${{ steps.strict.outputs.findings }}
        STRICT_OUTCOME: ${{ steps.strict.outcome }}
        CLEAN: ${{ steps.clean.outputs.findings }}
        CLEAN_OUTCOME: ${{ steps.clean.outcome }}
        SPACED: ${{ steps.spaced.outputs.findings }}
        SPACED_OUTCOME: ${{ steps.spaced.outcome }}
        SPACED_ONE_LINE_OUTCOME: ${{ steps.spaced-one-line.outcome }}
  textlint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        persist-credentials: false
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npm run build
    - run: node scripts/textlint-smoke.mjs
  vscode:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        persist-credentials: false
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npm run build
    - run: npm ci --ignore-scripts
      working-directory: vscode
    - run: npm run typecheck
      working-directory: vscode
    - run: npm test
      working-directory: vscode
    - run: npm run package
      working-directory: vscode
    - run: xvfb-run -a npm run test:host
      working-directory: vscode
  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        persist-credentials: false
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npm run coverage
  ci-ok:
    if: always()
    needs:
    - test
    - package
    - release-gate
    - bench
    - coverage
    - action
    - textlint
    - vscode
    runs-on: ubuntu-latest
    steps:
    - run: |
        echo "test: ${{ needs.test.result }}  package: ${{ needs.package.result }}  release-gate: ${{ needs.release-gate.result }}  bench: ${{ needs.bench.result }}  coverage: ${{ needs.coverage.result }}  action: ${{ needs.action.result }}  textlint: ${{ needs.textlint.result }}  vscode: ${{ needs.vscode.result }}"
        test "${{ needs.test.result }}" = success && test "${{ needs.package.result }}" = success && test "${{ needs.release-gate.result }}" = success && test "${{ needs.bench.result }}" = success && test "${{ needs.coverage.result }}" = success && test "${{ needs.action.result }}" = success && test "${{ needs.textlint.result }}" = success && test "${{ needs.vscode.result }}" = success
